name: pages

# Builds the docs site (site/) and publishes it to GitHub Pages: https://aontwit.github.io/pitwall/
# The site renders the plugin's own markdown, so a change to a playbook redeploys it too.
on:
  push:
    branches: [main]
    paths: ['site/**', 'plugin/**', 'README.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Build (astro check, astro build, Pagefind index)
        working-directory: site
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
